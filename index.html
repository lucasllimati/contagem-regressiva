<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">⏱</div>
                <div>
                    <h1 class="brand-title">Contagem Regressiva</h1>
                    <div class="brand-subtitle">Lista de eventos e prazos</div>
                </div>
            </div>
            <button class="primary-btn" id="openFormBtn" type="button" aria-expanded="false" aria-controls="eventFormWrapper">+ Novo evento</button>
        </header>

        <section class="stats-strip">
            <div class="stat-card">
                <div class="stat-label">Eventos</div>
                <div class="stat-value" id="totalEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ativos</div>
                <div class="stat-value" id="activeEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Expirados</div>
                <div class="stat-value" id="expiredEvents">0</div>
            </div>
        </section>

        <section class="toolbar" aria-label="Ferramentas para eventos">
            <div class="toolbar-left">
                <input type="search" id="searchInput" class="search-input" placeholder="Buscar evento..." aria-label="Buscar eventos">
                <button class="tool-btn" id="exportBtn" type="button">Exportar backup</button>
                <button class="tool-btn" id="importBtn" type="button">Importar backup</button>
                <input id="importFileInput" type="file" accept="application/json,.json" hidden>
                <button class="tool-btn" id="enableNotificationsBtn" type="button">Ativar lembretes</button>
            </div>
            <div class="toolbar-right">
                <select id="statusFilter" aria-label="Filtrar eventos por status">
                    <option value="all" selected>Todos</option>
                    <option value="active">Ativos</option>
                    <option value="inactive">Desativados</option>
                    <option value="expired">Expirados</option>
                </select>
                <select id="sortOrder" aria-label="Ordenar eventos">
                    <option value="soonest" selected>Mais próximo</option>
                    <option value="latest">Mais distante</option>
                    <option value="priority">Prioridade</option>
                    <option value="alphabetical">Descrição A-Z</option>
                </select>
                <select id="themeSelect" aria-label="Tema de cores">
                    <option value="blue" selected>Azul Profissional</option>
                    <option value="violet">Violeta</option>
                    <option value="green">Verde</option>
                    <option value="mono">Mono</option>
                </select>
            </div>
        </section>

        <form class="event-form-wrapper" id="eventFormWrapper" novalidate>
            <h2 class="form-title" id="formTitle">Adicionar evento</h2>
            <div class="form-grid">
                <label>
                    Descrição
                    <input type="text" id="descriptionInput" placeholder="Ex.: Entrega do projeto" maxlength="120" required>
                </label>
                <label>
                    Data e hora
                    <input type="datetime-local" id="dateInput" required>
                </label>
                <label>
                    Cor
                    <select id="colorInput">
                        <option value="blue" selected>Azul</option>
                        <option value="purple">Roxo</option>
                        <option value="green">Verde</option>
                        <option value="orange">Laranja</option>
                        <option value="red">Vermelho</option>
                    </select>
                </label>
                <label>
                    Prioridade
                    <select id="priorityInput">
                        <option value="low">Baixa</option>
                        <option value="medium" selected>Média</option>
                        <option value="high">Alta</option>
                        <option value="critical">Crítica</option>
                    </select>
                </label>
                <label>
                    Categoria
                    <input type="text" id="categoryInput" placeholder="Ex.: Trabalho, pessoal" maxlength="40">
                </label>
                <label>
                    Repetir
                    <select id="recurrenceInput">
                        <option value="none" selected>Não repetir</option>
                        <option value="daily">Diariamente</option>
                        <option value="weekly">Semanalmente</option>
                        <option value="monthly">Mensalmente</option>
                        <option value="yearly">Anualmente</option>
                    </select>
                </label>
                <label>
                    Lembrete
                    <select id="reminderInput">
                        <option value="0" selected>Sem lembrete</option>
                        <option value="300">5 minutos antes</option>
                        <option value="3600">1 hora antes</option>
                        <option value="86400">1 dia antes</option>
                    </select>
                </label>
                <label class="form-field-wide">
                    Notas
                    <textarea id="notesInput" rows="3" maxlength="1000" placeholder="Detalhes importantes sobre este evento"></textarea>
                </label>
                <label class="form-field-wide">
                    Link relacionado
                    <input type="url" id="linkInput" placeholder="https://exemplo.com">
                </label>
            </div>
            <div class="form-actions">
                <button class="secondary-btn" id="cancelBtn" type="button">Cancelar</button>
                <button class="primary-btn" id="saveBtn" type="submit">Confirmar</button>
            </div>
        </form>

        <section class="event-list" id="eventList" aria-label="Lista de eventos"></section>
        <div class="app-message" id="appMessage" role="status" aria-live="polite" hidden></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
