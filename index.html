<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07111f;
            --panel: rgba(30, 41, 59, 0.7);
            --line: rgba(255, 255, 255, 0.1);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --dim: #cbd5e1;
            --blue: #38bdf8;
            --purple: #6366f1;
            --green: #34d399;
            --danger: #f87171;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 80% 10%, rgba(99, 102, 241, 0.25), transparent 20%),
                radial-gradient(circle at 30% 90%, rgba(56, 189, 248, 0.2), transparent 20%),
                linear-gradient(135deg, #07111f 0%, #172554 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app {
            width: min(1100px, 100%);
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--line);
            border-radius: 30px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 24px 80px var(--shadow);
            padding: 24px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white;
            font-size: 1.4rem;
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 0.84rem;
            margin-top: 4px;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 24px rgba(56, 189, 248, 0.15);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .secondary-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.48);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .stat-value {
            color: var(--text);
            font-size: 1.38rem;
            font-weight: 800;
            margin-top: 7px;
        }

        .event-form-wrapper {
            display: none;
            background: rgba(30, 41, 59, 0.62);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .event-form-wrapper.open {
            display: block;
        }

        .form-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            background: rgba(30, 41, 59, 0.44);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar input[type="search"],
        .toolbar select {
            min-width: 170px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            border: 1px solid var(--line);
            outline: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .toolbar input[type="search"]::placeholder {
            color: var(--muted);
        }

        .toolbar input[type="search"]:focus,
        .toolbar select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(160px, 1fr));
            gap: 14px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        input[type="text"],
        input[type="datetime-local"],
        select {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            border: 1px solid var(--line);
            outline: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.96rem;
        }

        input[type="text"]::placeholder,
        input[type="datetime-local"]::placeholder {
            color: var(--muted);
        }

        input[type="text"]:focus,
        input[type="datetime-local"]:focus,
        select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .event-list {
            display: grid;
            gap: 14px;
        }

        .event-card {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 20px;
            display: grid;
            gap: 14px;
        }

        .event-card.inactive {
            opacity: 0.45;
            filter: grayscale(0.95) blur(0.2px);
            border-style: dashed;
        }

        .event-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
        }

        .event-description {
            color: var(--text);
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .event-date {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .event-card .countdown-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .time-card {
            min-width: 90px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.58);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
            flex: 1;
        }

        .time-card.hidden {
            display: none;
        }

        .time-value {
            font-size: clamp(1.6rem, 2vw, 2rem);
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }

        .time-label {
            font-size: 0.73rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-top: 4px;
        }

        .event-status {
            color: var(--green);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-finished {
            color: var(--danger);
        }

        .priority-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
            border: 1px solid var(--line);
            background: rgba(15, 23, 42, 0.5);
        }

        .priority-low { border-color: rgba(52, 211, 153, 0.6); color: var(--green); }
        .priority-medium { border-color: rgba(251, 191, 36, 0.6); color: var(--orange, #fbbf24); }
        .priority-high { border-color: rgba(248, 113, 113, 0.8); color: var(--danger); }
        .priority-critical { border-color: rgba(239, 68, 68, 1); color: var(--danger); }

        .progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .progress-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 0.73rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .progress-percent {
            color: var(--text);
            font-weight: 900;
        }

        .progress-line {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: inset 0 0 12px rgba(255,255,255,0.03);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: inherit;
            transition: width 280ms linear, filter 0.3s ease, background 320ms ease;
            box-shadow: 0 0 16px rgba(56,189,248,0.3);
        }

        .progress-bar.finished {
            background: linear-gradient(135deg, var(--green), var(--blue));
        }

        .event-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .event-action-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .event-action-btn,
        .toggle-btn {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
            padding: 9px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event-action-btn:hover,
        .toggle-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .toggle-btn.disabled {
            color: var(--muted);
            border-color: var(--line);
        }

        .event-action-btn.delete {
            border-color: rgba(248, 113, 113, 0.7);
            color: var(--danger);
        }

        .event-action-btn.delete:hover {
            background: rgba(248, 113, 113, 0.1);
        }

        @media (max-width: 780px) {
            .app-header,
            .event-info {
                align-items: flex-start;
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats-strip {
                grid-template-columns: 1fr;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .time-card {
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">⏱</div>
                <div>
                    <div class="brand-title">Contagem Regressiva</div>
                    <div class="brand-subtitle">Lista de eventos e prazos</div>
                </div>
            </div>
            <button class="primary-btn" id="openFormBtn">+ Novo evento</button>
        </header>

        <section class="stats-strip">
            <div class="stat-card">
                <div class="stat-label">Eventos</div>
                <div class="stat-value" id="totalEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ativos</div>
                <div class="stat-value" id="activeEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Expirados</div>
                <div class="stat-value" id="expiredEvents">0</div>
            </div>
        </section>

        <section class="toolbar">
            <div class="toolbar-left">
                <input type="search" id="searchInput" class="search-input" placeholder="Buscar evento...">
            </div>
            <div class="toolbar-right">
                <select id="statusFilter">
                    <option value="all" selected>Todos</option>
                    <option value="active">Ativos</option>
                    <option value="inactive">Desativados</option>
                    <option value="expired">Expirados</option>
                </select>
                <select id="sortOrder">
                    <option value="soonest" selected>Mais próximo</option>
                    <option value="latest">Mais distante</option>
                    <option value="priority">Prioridade</option>
                    <option value="alphabetical">Descrição A-Z</option>
                </select>
                <select id="themeSelect">
                    <option value="blue" selected>Azul Profissional</option>
                    <option value="violet">Violeta</option>
                    <option value="green">Verde</option>
                    <option value="mono">Mono</option>
                </select>
            </div>
        </section>

        <section class="event-form-wrapper" id="eventFormWrapper">
            <div class="form-title" id="formTitle">Adicionar evento</div>
            <div class="form-grid">
                <label>
                    Descrição
                    <input type="text" id="descriptionInput" placeholder="Ex.: Entrega do projeto">
                </label>
                <label>
                    Data e hora
                    <input type="datetime-local" id="dateInput">
                </label>
                <label>
                    Cor
                    <select id="colorInput">
                        <option value="blue" selected>Azul</option>
                        <option value="purple">Roxo</option>
                        <option value="green">Verde</option>
                        <option value="orange">Laranja</option>
                        <option value="red">Vermelho</option>
                    </select>
                </label>
                <label>
                    Prioridade
                    <select id="priorityInput">
                        <option value="low">Baixa</option>
                        <option value="medium" selected>Média</option>
                        <option value="high">Alta</option>
                        <option value="critical">Crítica</option>
                    </select>
                </label>
            </div>
            <div class="form-actions">
                <button class="secondary-btn" id="cancelBtn">Cancelar</button>
                <button class="primary-btn" id="saveBtn">Confirmar</button>
            </div>
        </section>

        <section class="event-list" id="eventList"></section>
    </div>

    <script>
        const eventList = document.getElementById('eventList');
        const openFormBtn = document.getElementById('openFormBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const eventFormWrapper = document.getElementById('eventFormWrapper');
        const descriptionInput = document.getElementById('descriptionInput');
        const dateInput = document.getElementById('dateInput');
        const colorInput = document.getElementById('colorInput');
        const priorityInput = document.getElementById('priorityInput');
        const saveBtn = document.getElementById('saveBtn');
        const formTitle = document.getElementById('formTitle');
        const totalEventsValue = document.getElementById('totalEvents');
        const activeEventsValue = document.getElementById('activeEvents');
        const expiredEventsValue = document.getElementById('expiredEvents');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const sortOrder = document.getElementById('sortOrder');
        const themeSelect = document.getElementById('themeSelect');

        const events = [];
        const storageKey = 'contagemRegressivaEventsV1';
        let editingEventId = null;

        const colors = {
            blue: '#38bdf8',
            purple: '#6366f1',
            green: '#34d399',
            orange: '#fbbf24',
            red: '#f87171'
        };

        const priorityMap = {
            low: { label: 'Baixa', order: 1 },
            medium: { label: 'Média', order: 2 },
            high: { label: 'Alta', order: 3 },
            critical: { label: 'Crítica', order: 4 }
        };

        function formatInputDate(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function endOfCurrentDayDate() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        }

        function endOfYearDate() {
            const now = new Date();
            return new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
        }

        function initializeDefaults() {
            const savedEvents = loadEvents();
            if (savedEvents.length > 0) {
                events.push(...savedEvents);
                return;
            }

            events.push({
                id: makeId(),
                description: 'Até 23:59 do dia atual',
                date: endOfCurrentDayDate().toISOString(),
                defaultEvent: true,
                active: true,
                color: 'blue',
                priority: 'high',
                createdAt: new Date().toISOString()
            });

            events.push({
                id: makeId(),
                description: 'Até o final do ano',
                date: endOfYearDate().toISOString(),
                defaultEvent: true,
                active: true,
                color: 'purple',
                priority: 'medium',
                createdAt: new Date().toISOString()
            });

            saveEvents();
        }

        function loadEvents() {
            try {
                const raw = localStorage.getItem(storageKey);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return parsed.map(event => {
                    if (!event.createdAt) {
                        event.createdAt = new Date().toISOString();
                    }
                    return event;
                });
            } catch (error) {
                return [];
            }
        }

        function saveEvents() {
            localStorage.setItem(storageKey, JSON.stringify(events));
        }

        function makeId() {
            return Math.random().toString(36).slice(2, 10);
        }

        function renderEvents() {
            const filtered = getFilteredAndSortedEvents();
            eventList.innerHTML = '';

            for (const event of filtered) {
                const card = document.createElement('article');
                card.className = event.active === false ? 'event-card inactive' : 'event-card';
                card.dataset.id = event.id;
                card.style.borderLeft = `4px solid ${colors[event.color] || colors.blue}`;

                const targetTime = new Date(event.date).getTime();
                const difference = targetTime - Date.now();
                const eventDone = difference <= 0;

                const info = document.createElement('div');
                info.className = 'event-info';

                const descWrap = document.createElement('div');
                descWrap.style.display = 'flex';
                descWrap.style.flexDirection = 'column';
                descWrap.style.gap = '8px';

                const desc = document.createElement('div');
                desc.className = 'event-description';
                desc.innerHTML = event.description;

                const priority = document.createElement('div');
                priority.className = `priority-tag priority-${event.priority || 'low'}`;
                priority.innerHTML = `Prioridade ${priorityMap[event.priority || 'low'].label}`;

                descWrap.appendChild(desc);
                descWrap.appendChild(priority);

                const dateText = document.createElement('div');
                dateText.className = 'event-date';
                dateText.innerHTML = new Date(event.date).toLocaleString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                info.appendChild(descWrap);
                info.appendChild(dateText);

                const grid = document.createElement('div');
                grid.className = 'countdown-grid';

                const count = calculateCountdown(targetTime);
                const units = [
                    { key: 'weeks', value: count.weeks, label: 'Semanas' },
                    { key: 'days', value: count.days, label: 'Dias' },
                    { key: 'hours', value: count.hours, label: 'Horas' },
                    { key: 'minutes', value: count.minutes, label: 'Minutos' },
                    { key: 'seconds', value: count.seconds, label: 'Segundos' }
                ];

                const visibleUnits = [];
                for (const unit of units) {
                    if (unit.key === 'weeks' && unit.value === 0) continue;
                    if (unit.key === 'days' && unit.value === 0 && count.weeks === 0) continue;
                    if (unit.key === 'hours' && unit.value === 0 && count.days === 0 && count.weeks === 0) continue;
                    if (unit.key === 'minutes' && unit.value === 0 && count.hours === 0 && count.days === 0 && count.weeks === 0) continue;
                    visibleUnits.push(unit);
                }

                for (const unit of visibleUnits) {
                    const timeCard = document.createElement('div');
                    timeCard.className = 'time-card';

                    const value = document.createElement('div');
                    value.className = 'time-value';
                    value.innerHTML = unit.value;

                    const label = document.createElement('div');
                    label.className = 'time-label';
                    label.innerHTML = unit.label;

                    timeCard.appendChild(value);
                    timeCard.appendChild(label);
                    grid.appendChild(timeCard);
                }

                const progressWrap = document.createElement('div');
                progressWrap.className = 'progress-wrapper';

                const progressHead = document.createElement('div');
                progressHead.className = 'progress-head';
                const progressLabel = document.createElement('span');
                progressLabel.innerHTML = eventDone ? 'Conclusão' : 'Progresso';
                const progressPercent = document.createElement('span');
                progressPercent.className = 'progress-percent';
                progressHead.appendChild(progressLabel);
                progressHead.appendChild(progressPercent);

                const progressLine = document.createElement('div');
                progressLine.className = 'progress-line';
                const progressBar = document.createElement('div');
                progressBar.className = 'progress-bar';
                if (eventDone) {
                    progressBar.classList.add('finished');
                }

                const eventCreatedAt = event.createdAt ? new Date(event.createdAt).getTime() : Date.now();
                const target = new Date(event.date).getTime();
                const totalDuration = Math.max(1, target - eventCreatedAt);
                const elapsed = Math.max(0, Date.now() - eventCreatedAt);
                const rawProgress = eventDone ? 100 : Math.min(99, Math.max(0, (elapsed / totalDuration) * 100));
                const progressPercentValue = Math.round(rawProgress);

                progressBar.style.width = `${Math.max(0, Math.min(100, progressPercentValue))}%`;
                progressPercent.innerHTML = `${progressPercentValue}%`;

                if (eventDone) {
                    progressBar.style.width = '100%';
                    progressBar.classList.add('finished');
                    progressPercent.innerHTML = '100%';
                }

                progressLine.appendChild(progressBar);
                progressWrap.appendChild(progressHead);
                progressWrap.appendChild(progressLine);

                const actions = document.createElement('div');
                actions.className = 'event-actions';

                const status = document.createElement('div');
                status.className = eventDone ? 'event-status status-finished' : 'event-status';
                status.innerHTML = eventDone ? 'Expirado · Concluído' : 'Ativo';

                const actionGroup = document.createElement('div');
                actionGroup.className = 'event-action-group';

                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = event.active === false ? 'toggle-btn disabled' : 'toggle-btn';
                toggle.innerHTML = event.active === false ? 'Ativar' : 'Desativar';
                toggle.addEventListener('click', () => {
                    event.active = event.active === false ? true : false;
                    saveEvents();
                    renderEvents();
                });

                const edit = document.createElement('button');
                edit.type = 'button';
                edit.className = 'event-action-btn';
                edit.innerHTML = 'Editar';
                edit.addEventListener('click', () => {
                    openFormForEdit(event.id);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'event-action-btn delete';
                deleteBtn.innerHTML = 'Excluir';
                deleteBtn.addEventListener('click', () => {
                    const idx = events.findIndex(item => item.id === event.id);
                    if (idx >= 0) {
                        events.splice(idx, 1);
                        saveEvents();
                        renderEvents();
                    }
                });

                actionGroup.appendChild(toggle);
                actionGroup.appendChild(edit);
                actionGroup.appendChild(deleteBtn);

                actions.appendChild(status);
                actions.appendChild(actionGroup);

                card.appendChild(info);
                card.appendChild(grid);
                card.appendChild(progressWrap);
                card.appendChild(actions);
                eventList.appendChild(card);
            }

            renderStats();
        }

        function getFilteredAndSortedEvents() {
            const query = (searchInput.value || '').trim().toLowerCase();
            const filter = statusFilter.value || 'all';
            const sort = sortOrder.value || 'soonest';

            let filtered = events.filter(event => {
                const matchesQuery = !query || event.description.toLowerCase().includes(query);
                const isExpired = new Date(event.date).getTime() < Date.now();
                const active = event.active !== false;

                if (!matchesQuery) return false;

                if (filter === 'active') return active && !isExpired;
                if (filter === 'inactive') return !active;
                if (filter === 'expired') return isExpired;
                return true;
            });

            filtered.sort((a, b) => {
                if (sort === 'latest') return new Date(a.date) - new Date(b.date);
                if (sort === 'priority') return (priorityMap[b.priority || 'low'].order || 0) - (priorityMap[a.priority || 'low'].order || 0);
                if (sort === 'alphabetical') return a.description.localeCompare(b.description);
                return new Date(a.date) - new Date(b.date);
            });

            return filtered;
        }

        function renderStats() {
            const expired = events.filter(event => new Date(event.date).getTime() < Date.now()).length;
            const active = events.filter(event => event.active && new Date(event.date).getTime() >= Date.now()).length;
            totalEventsValue.innerHTML = String(events.length);
            activeEventsValue.innerHTML = String(active);
            expiredEventsValue.innerHTML = String(expired);
        }

        function calculateCountdown(targetTime) {
            const diff = Math.max(0, targetTime - Date.now());
            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;
            const week = day * 7;

            const weeks = Math.floor(diff / week);
            const days = Math.floor((diff % week) / day);
            const hours = Math.floor((diff % day) / hour);
            const minutes = Math.floor((diff % hour) / minute);
            const seconds = Math.floor((diff % minute) / second);

            return { weeks, days, hours, minutes, seconds };
        }

        function openFormForEdit(id) {
            const event = events.find(item => item.id === id);
            if (!event) return;

            editingEventId = id;
            eventFormWrapper.classList.add('open');
            formTitle.innerHTML = 'Editar evento';
            saveBtn.innerHTML = 'Salvar';
            descriptionInput.value = event.description;
            dateInput.value = formatInputDate(new Date(event.date));
            colorInput.value = event.color || 'blue';
            priorityInput.value = event.priority || 'medium';
        }

        function resetForm() {
            eventFormWrapper.classList.remove('open');
            formTitle.innerHTML = 'Adicionar evento';
            saveBtn.innerHTML = 'Confirmar';
            descriptionInput.value = '';
            dateInput.value = formatInputDate(new Date());
            colorInput.value = 'blue';
            priorityInput.value = 'medium';
            editingEventId = null;
        }

        openFormBtn.addEventListener('click', () => {
            eventFormWrapper.classList.toggle('open');
            if (!eventFormWrapper.classList.contains('open')) {
                resetForm();
            }
        });

        cancelBtn.addEventListener('click', () => {
            resetForm();
        });

        saveBtn.addEventListener('click', () => {
            const description = descriptionInput.value.trim();
            const date = new Date(dateInput.value);

            if (!description || Number.isNaN(date.getTime())) {
                eventFormWrapper.classList.add('open');
                return;
            }

            if (editingEventId) {
                const event = events.find(item => item.id === editingEventId);
                if (event) {
                    event.description = description;
                    event.date = date.toISOString();
                    event.color = colorInput.value || 'blue';
                    event.priority = priorityInput.value || 'medium';
                    if (!event.createdAt) {
                        event.createdAt = new Date().toISOString();
                    }
                }
            } else {
                events.unshift({
                    id: makeId(),
                    description,
                    date: date.toISOString(),
                    defaultEvent: false,
                    active: true,
                    color: colorInput.value || 'blue',
                    priority: priorityInput.value || 'medium',
                    createdAt: new Date().toISOString()
                });
            }

            saveEvents();
            resetForm();
            renderEvents();
        });

        searchInput.addEventListener('input', renderEvents);
        statusFilter.addEventListener('change', renderEvents);
        sortOrder.addEventListener('change', renderEvents);
        themeSelect.addEventListener('change', applyTheme);

        function applyTheme() {
            const selected = themeSelect.value || 'blue';
            const themes = {
                blue: { '--blue': '#38bdf8', '--purple': '#6366f1', '--green': '#34d399', '--danger': '#f87171' },
                violet: { '--blue': '#8b5cf6', '--purple': '#ec4899', '--green': '#34d399', '--danger': '#f87171' },
                green: { '--blue': '#22c55e', '--purple': '#14b8a6', '--green': '#bef264', '--danger': '#f87171' },
                mono: { '--blue': '#cbd5e1', '--purple': '#94a3b8', '--green': '#e2e8f0', '--danger': '#f87171' }
            };

            const selectedTheme = themes[selected] || themes.blue;
            const root = document.documentElement;
            Object.entries(selectedTheme).forEach(([key, value]) => {
                root.style.setProperty(key, value);
            });
        }

        initializeDefaults();
        dateInput.value = formatInputDate(new Date());
        applyTheme();
        renderEvents();
        setInterval(renderEvents, 1000);
    </script>
</body>
</html>
