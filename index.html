<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07111f;
            --panel: rgba(30, 41, 59, 0.7);
            --line: rgba(255, 255, 255, 0.1);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --dim: #cbd5e1;
            --blue: #38bdf8;
            --purple: #6366f1;
            --green: #34d399;
            --danger: #f87171;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 80% 10%, rgba(99, 102, 241, 0.25), transparent 20%),
                radial-gradient(circle at 30% 90%, rgba(56, 189, 248, 0.2), transparent 20%),
                linear-gradient(135deg, #07111f 0%, #172554 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app {
            width: min(1100px, 100%);
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--line);
            border-radius: 30px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 24px 80px var(--shadow);
            padding: 24px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white;
            font-size: 1.4rem;
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 0.84rem;
            margin-top: 4px;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 24px rgba(56, 189, 248, 0.15);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .secondary-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .event-form-wrapper {
            display: none;
            background: rgba(30, 41, 59, 0.62);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .event-form-wrapper.open {
            display: block;
        }

        .form-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
        }

        .form-grid {
            display: grid;
            grid-template-columns: minmax(250px, 1.5fr) minmax(220px, 1fr);
            gap: 14px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        input[type="text"],
        input[type="datetime-local"] {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            border: 1px solid var(--line);
            outline: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.96rem;
        }

        input[type="text"]::placeholder,
        input[type="datetime-local"]::placeholder {
            color: var(--muted);
        }

        input[type="text"]:focus,
        input[type="datetime-local"]:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .event-list {
            display: grid;
            gap: 14px;
        }

        .event-card {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 20px;
            display: grid;
            gap: 14px;
        }

        .event-card.inactive {
            opacity: 0.45;
            filter: grayscale(0.95) blur(0.2px);
            border-style: dashed;
        }

        .event-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
        }

        .event-description {
            color: var(--text);
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .event-date {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .event-card .countdown-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .time-card {
            min-width: 90px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.58);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
            flex: 1;
        }

        .time-card.hidden {
            display: none;
        }

        .time-value {
            font-size: clamp(1.6rem, 2vw, 2rem);
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }

        .time-label {
            font-size: 0.73rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-top: 4px;
        }

        .event-status {
            color: var(--green);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-finished {
            color: var(--danger);
        }

        .event-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
            padding: 9px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .toggle-btn.disabled {
            color: var(--muted);
            border-color: var(--line);
        }

        @media (max-width: 780px) {
            .app-header,
            .event-info {
                align-items: flex-start;
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .time-card {
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">⏱</div>
                <div>
                    <div class="brand-title">Contagem Regressiva</div>
                    <div class="brand-subtitle">Lista de eventos e prazos</div>
                </div>
            </div>
            <button class="primary-btn" id="openFormBtn">+ Novo evento</button>
        </header>

        <section class="event-form-wrapper" id="eventFormWrapper">
            <div class="form-title">Adicionar evento</div>
            <div class="form-grid">
                <label>
                    Descrição
                    <input type="text" id="descriptionInput" placeholder="Ex.: Entrega do projeto">
                </label>
                <label>
                    Data e hora
                    <input type="datetime-local" id="dateInput">
                </label>
            </div>
            <div class="form-actions">
                <button class="secondary-btn" id="cancelBtn">Cancelar</button>
                <button class="primary-btn" id="saveBtn">Confirmar</button>
            </div>
        </section>

        <section class="event-list" id="eventList"></section>
    </div>

    <script>
        const eventList = document.getElementById('eventList');
        const openFormBtn = document.getElementById('openFormBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const eventFormWrapper = document.getElementById('eventFormWrapper');
        const descriptionInput = document.getElementById('descriptionInput');
        const dateInput = document.getElementById('dateInput');
        const saveBtn = document.getElementById('saveBtn');

        const events = [];

        function formatInputDate(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function endOfCurrentDayDate() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        }

        function endOfYearDate() {
            const now = new Date();
            return new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
        }

        function initializeDefaults() {
            events.push({
                id: makeId(),
                description: 'Até 00:00 do próximo dia',
                date: endOfCurrentDayDate().toISOString(),
                defaultEvent: true,
                active: true
            });

            events.push({
                id: makeId(),
                description: 'Até o final do ano',
                date: endOfYearDate().toISOString(),
                defaultEvent: true,
                active: true
            });
        }

        function makeId() {
            return Math.random().toString(36).slice(2, 10);
        }

        function renderEvents() {
            eventList.innerHTML = '';

            for (const event of events) {
                const card = document.createElement('article');
                card.className = event.active === false ? 'event-card inactive' : 'event-card';
                card.dataset.id = event.id;

                const targetTime = new Date(event.date).getTime();
                const difference = targetTime - Date.now();
                const eventDone = difference <= 0;

                const info = document.createElement('div');
                info.className = 'event-info';

                const desc = document.createElement('div');
                desc.className = 'event-description';
                desc.innerHTML = event.description;

                const dateText = document.createElement('div');
                dateText.className = 'event-date';
                dateText.innerHTML = new Date(event.date).toLocaleString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                info.appendChild(desc);
                info.appendChild(dateText);

                const grid = document.createElement('div');
                grid.className = 'countdown-grid';

                const count = calculateCountdown(targetTime);
                const units = [
                    { key: 'weeks', value: count.weeks, label: 'Semanas' },
                    { key: 'days', value: count.days, label: 'Dias' },
                    { key: 'hours', value: count.hours, label: 'Horas' },
                    { key: 'minutes', value: count.minutes, label: 'Minutos' },
                    { key: 'seconds', value: count.seconds, label: 'Segundos' }
                ];

                const visibleUnits = [];
                for (const unit of units) {
                    if (unit.key === 'weeks' && unit.value === 0) continue;
                    if (unit.key === 'days' && unit.value === 0 && count.weeks === 0) continue;
                    if (unit.key === 'hours' && unit.value === 0 && count.days === 0 && count.weeks === 0) continue;
                    if (unit.key === 'minutes' && unit.value === 0 && count.hours === 0 && count.days === 0 && count.weeks === 0) continue;
                    visibleUnits.push(unit);
                }

                for (const unit of visibleUnits) {
                    const timeCard = document.createElement('div');
                    timeCard.className = 'time-card';

                    const value = document.createElement('div');
                    value.className = 'time-value';
                    value.innerHTML = unit.value;

                    const label = document.createElement('div');
                    label.className = 'time-label';
                    label.innerHTML = unit.label;

                    timeCard.appendChild(value);
                    timeCard.appendChild(label);
                    grid.appendChild(timeCard);
                }

                const actions = document.createElement('div');
                actions.className = 'event-actions';

                const status = document.createElement('div');
                status.className = eventDone ? 'event-status status-finished' : 'event-status';
                status.innerHTML = eventDone ? 'Expirado' : 'Ativo';

                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = event.active === false ? 'toggle-btn disabled' : 'toggle-btn';
                toggle.innerHTML = event.active === false ? 'Ativar' : 'Desativar';
                toggle.addEventListener('click', () => {
                    event.active = event.active === false ? true : false;
                    renderEvents();
                });

                actions.appendChild(status);
                actions.appendChild(toggle);

                card.appendChild(info);
                card.appendChild(grid);
                card.appendChild(actions);
                eventList.appendChild(card);
            }
        }

        function calculateCountdown(targetTime) {
            const diff = Math.max(0, targetTime - Date.now());
            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;
            const week = day * 7;

            const weeks = Math.floor(diff / week);
            const days = Math.floor((diff % week) / day);
            const hours = Math.floor((diff % day) / hour);
            const minutes = Math.floor((diff % hour) / minute);
            const seconds = Math.floor((diff % minute) / second);

            return { weeks, days, hours, minutes, seconds };
        }

        openFormBtn.addEventListener('click', () => {
            eventFormWrapper.classList.toggle('open');
        });

        cancelBtn.addEventListener('click', () => {
            eventFormWrapper.classList.remove('open');
            descriptionInput.value = '';
            dateInput.value = '';
        });

        saveBtn.addEventListener('click', () => {
            const description = descriptionInput.value.trim();
            const date = new Date(dateInput.value);

            if (!description || Number.isNaN(date.getTime())) {
                eventFormWrapper.classList.add('open');
                return;
            }

            events.unshift({
                id: makeId(),
                description,
                date: date.toISOString(),
                defaultEvent: false,
                active: true
            });

            descriptionInput.value = '';
            dateInput.value = '';
            eventFormWrapper.classList.remove('open');
            renderEvents();
        });

        initializeDefaults();
        dateInput.value = formatInputDate(new Date());
        renderEvents();
        setInterval(renderEvents, 1000);
    </script>
</body>
</html>
